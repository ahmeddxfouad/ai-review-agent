project_name: Storefront Backend

sections:
  - id: readme_setup
    title: README & Requirements Documentation
    requirement: Create a README.md file containing project setup instructions.
    pass_rule: all
    checks:
      - id: readme_exists
        type: file_exists
        path: README.md
        description: README.md exists

      - id: install_instructions
        type: text_contains_any
        path: README.md
        keywords:
          - npm install
          - yarn install
          - pnpm install
        description: README includes package installation instructions

      - id: database_setup
        type: text_contains_any
        path: README.md
        keywords:
          - postgres
          - postgresql
          - database
          - db-migrate
          - psql
        description: README includes database setup and connection information

      - id: ports_documented
        type: text_contains_any
        path: README.md
        keywords:
          - 3000
          - 5432
          - port
          - backend port
          - database port
        description: README documents backend and database ports
    pass_feedback: |
      > **Passing ✅** — README setup instructions are clear enough for a reviewer to install, configure, and start the project.

      ## General Feedback

      Your README provides the key setup information a reviewer needs: dependency installation, database setup or connection details, and port information for the backend and PostgreSQL database. This makes the project much easier to run from a fresh submission.

      ## Requirement Status

      - **Package installation instructions:** ✔ The README includes installation guidance such as `npm install`, `yarn install`, or an equivalent command.
      - **Database setup and connection:** ✔ The README includes database-related setup details for PostgreSQL, `psql`, `db-migrate`, or the project database configuration.
      - **Backend and database ports:** ✔ Port information is documented so the reviewer knows where the API and database are expected to run.

      ## Recommendations

      - Keep the setup instructions ordered exactly as a reviewer should run them from a clean checkout.
      - Include a short `.env` example in the README so reviewers can configure the app without exposing real secrets.

      ## Reference Resources

      - npm CLI `install`: https://docs.npmjs.com/cli/commands/npm-install
      - PostgreSQL documentation: https://www.postgresql.org/docs/current/
      - node-postgres getting started: https://node-postgres.com/
    fail_feedback: |
      > **Not Passing ❌** — README setup instructions do not yet fully meet the project requirements.

      ## General Feedback

      The README needs more complete setup documentation. A reviewer should be able to follow the README from a fresh download and successfully install dependencies, configure/connect to PostgreSQL, and know which ports the backend and database use.

      ## Requirement Status

      - **Package installation instructions:** ❌ Add a clear command such as `npm install`, `yarn install`, or `pnpm install`.
      - **Database setup and connection:** ❌ Document how to create/connect to the PostgreSQL database and how migrations should be run.
      - **Backend and database ports:** ❌ Document the backend API port and PostgreSQL database port.

      ## Recommendations

      - Add a numbered setup section with install, database creation, migration, test, and start commands.
      - Add an **Environment Variables** or **.env Example** section with non-secret sample values.
      - Include any required PostgreSQL database names for development and testing.

      ## Reference Resources

      - npm CLI `install`: https://docs.npmjs.com/cli/commands/npm-install
      - PostgreSQL documentation: https://www.postgresql.org/docs/current/
      - node-postgres getting started: https://node-postgres.com/

  - id: requirements_api_routes
    title: REQUIREMENTS API Routes
    requirement: Update REQUIREMENTS.md with correct RESTful route information and HTTP verbs.
    pass_rule: all
    checks:
      - id: requirements_exists
        type: file_exists
        path: REQUIREMENTS.md
        description: REQUIREMENTS.md exists

      - id: routes_documented
        type: text_contains_all
        path: REQUIREMENTS.md
        keywords:
          - GET
          - POST
          - products
          - users
          - orders
        description: REQUIREMENTS.md documents required REST routes and verbs
    pass_feedback: |
      > **Passing ✅** — API route information is documented with RESTful endpoints and HTTP verbs.

      ## General Feedback

      Your `REQUIREMENTS.md` includes the key route information reviewers need to compare the API implementation against the project specifications. The required resources are represented, and the route documentation includes HTTP verbs.

      ## Requirement Status

      - **RESTful routes listed:** ✔ Required endpoint groups such as products, users, and orders are documented.
      - **HTTP verbs included:** ✔ Routes are associated with HTTP verbs such as `GET` and `POST`.
      - **Reviewer usability:** ✔ The route information gives reviewers a clear checklist for endpoint testing.

      ## Recommendations

      - Use a table with columns for method, route, request body, response shape, and auth requirement.
      - Mark protected routes clearly so JWT testing is easy to verify.

      ## Reference Resources

      - Express routing guide: https://expressjs.com/en/guide/routing.html
      - MDN HTTP request methods: https://developer.mozilla.org/en-US/docs/Web/HTTP/Methods
      - REST resource naming guide: https://restfulapi.net/resource-naming/
    fail_feedback: |
      > **Not Passing ❌** — `REQUIREMENTS.md` does not yet provide enough API route information.

      ## General Feedback

      The project requirements document must list the required RESTful endpoints and associate each endpoint with the correct HTTP verb. This section is important because reviewers use it as the source of truth when checking routes and endpoint tests.

      ## Requirement Status

      - **RESTful routes listed:** ❌ Add the required product, user, and order endpoints.
      - **HTTP verbs included:** ❌ Each route needs its corresponding verb, such as `GET`, `POST`, `PUT`, or `DELETE`.
      - **Reviewer usability:** ❌ The route documentation is not yet complete enough to verify endpoint coverage.

      ## Recommendations

      - Add a route table to `REQUIREMENTS.md` for all required endpoints.
      - Use RESTful URLs such as `/products`, `/products/:id`, `/users`, `/users/:id`, and `/orders`.
      - Include which routes require JWT authentication.

      ## Reference Resources

      - Express routing guide: https://expressjs.com/en/guide/routing.html
      - MDN HTTP request methods: https://developer.mozilla.org/en-US/docs/Web/HTTP/Methods
      - REST resource naming guide: https://restfulapi.net/resource-naming/

  - id: requirements_database_schema
    title: REQUIREMENTS Database Schema
    requirement: Update REQUIREMENTS.md with a database schema containing tables, columns, and column types.
    pass_rule: all
    checks:
      - id: requirements_exists
        type: file_exists
        path: REQUIREMENTS.md
        description: REQUIREMENTS.md exists

      - id: schema_tables_documented
        type: text_contains_all
        path: REQUIREMENTS.md
        keywords:
          - users
          - products
          - orders
          - id
          - type
        description: REQUIREMENTS.md documents required database tables and column types

      - id: order_products_relationship_documented
        type: text_contains_any
        path: REQUIREMENTS.md
        keywords:
          - order_products
          - product_orders
          - order products
          - product orders
        description: REQUIREMENTS.md documents the orders-to-products relationship table
    pass_feedback: |
      > **Passing ✅** — The database schema is documented with tables, columns, types, and relationships.

      ## General Feedback

      Your `REQUIREMENTS.md` includes database schema information that maps the API data shapes to relational tables. The schema documentation gives reviewers enough information to compare migrations, models, and endpoint behavior.

      ## Requirement Status

      - **Tables documented:** ✔ Required tables such as users, products, orders, and the order/product relationship table are represented.
      - **Columns and types included:** ✔ The schema includes column names and data types.
      - **Relationships addressed:** ✔ The order-to-products relationship is documented.

      ## Recommendations

      - Keep the schema table names aligned with migration and model names.
      - Include primary keys, foreign keys, and any important constraints in the schema section.

      ## Reference Resources

      - PostgreSQL `CREATE TABLE`: https://www.postgresql.org/docs/current/sql-createtable.html
      - PostgreSQL constraints: https://www.postgresql.org/docs/current/ddl-constraints.html
      - PostgreSQL data types: https://www.postgresql.org/docs/current/datatype.html
    fail_feedback: |
      > **Not Passing ❌** — The database schema in `REQUIREMENTS.md` is incomplete or missing.

      ## General Feedback

      `REQUIREMENTS.md` must include a database schema with table names, columns, column types, and relationships that support the required API endpoints. This is especially important for the orders requirement, which needs a one-to-many or join-table relationship between orders and products.

      ## Requirement Status

      - **Tables documented:** ❌ Add the required tables such as users, products, orders, and an order/product relationship table.
      - **Columns and types included:** ❌ Include each required column and its PostgreSQL type.
      - **Relationships addressed:** ❌ Document how orders connect to products, including foreign keys or join table columns.

      ## Recommendations

      - Add a schema section to `REQUIREMENTS.md` with one table per database table.
      - Include `id`, required fields, foreign keys, and data types.
      - Make sure the schema matches the actual migrations and model types.

      ## Reference Resources

      - PostgreSQL `CREATE TABLE`: https://www.postgresql.org/docs/current/sql-createtable.html
      - PostgreSQL constraints: https://www.postgresql.org/docs/current/ddl-constraints.html
      - PostgreSQL data types: https://www.postgresql.org/docs/current/datatype.html

  - id: database_connection
    title: Database Connection
    requirement: Create a PostgreSQL database and connect the Node API to it.
    pass_rule: all
    checks:
      - id: pg_dependency
        type: package_json_has_dependency
        dependencies:
          - pg
        mode: any
        description: package.json includes node-postgres dependency

      - id: database_config_found
        type: file_list_contains_any
        keywords:
          - database.json
          - database.ts
          - database.js
          - client.ts
          - db.ts
        description: Database connection/configuration files are present

      - id: dotenv_dependency
        type: package_json_has_dependency
        dependencies:
          - dotenv
        mode: any
        description: package.json includes dotenv for database configuration
    pass_feedback: |
      > **Passing ✅** — The project includes evidence of a PostgreSQL database connection.

      ## General Feedback

      Your backend includes the expected database tooling and configuration patterns for connecting a Node/Express API to PostgreSQL. The presence of `pg`, database configuration files, and environment-variable support gives reviewers a clear path to validate the connection.

      ## Requirement Status

      - **PostgreSQL client dependency:** ✔ The project includes `pg` for PostgreSQL access from Node.
      - **Database configuration:** ✔ A database configuration or client file is present.
      - **Environment-driven setup:** ✔ Database credentials can be managed through environment variables.

      ## Recommendations

      - Make sure the database connection is tested with the same setup instructions documented in the README.
      - Prefer a shared database client or pool module to avoid duplicate connection logic.

      ## Reference Resources

      - node-postgres documentation: https://node-postgres.com/
      - node-postgres pooling: https://node-postgres.com/features/pooling
      - dotenv package documentation: https://www.npmjs.com/package/dotenv
    fail_feedback: |
      > **Not Passing ❌** — The project does not yet show enough evidence of a working PostgreSQL connection.

      ## General Feedback

      The Node API must be able to connect to a PostgreSQL database. Reviewers should be able to identify the database client/configuration code and verify that the app reads connection information from environment variables.

      ## Requirement Status

      - **PostgreSQL client dependency:** ❌ Add `pg` or otherwise make the PostgreSQL connection implementation clear.
      - **Database configuration:** ❌ Include a database client/configuration module, commonly named `database.ts`, `client.ts`, `db.ts`, or similar.
      - **Environment-driven setup:** ❌ Use environment variables for database credentials rather than hardcoded values.

      ## Recommendations

      - Add `pg` and configure a shared `Pool` or `Client`.
      - Document database names, user, password, host, and port in the README as sample values.
      - Verify the API can retrieve data from the database after migrations run.

      ## Reference Resources

      - node-postgres documentation: https://node-postgres.com/
      - node-postgres pooling: https://node-postgres.com/features/pooling
      - dotenv package documentation: https://www.npmjs.com/package/dotenv

  - id: database_relational_design
    title: Relational Database Design
    requirement: Design tables, columns, and relationships that address all required API data shapes.
    pass_rule: all
    checks:
      - id: migrations_folder
        type: folder_exists
        path: migrations
        description: migrations folder exists

      - id: migration_files
        type: glob_exists
        pattern: "migrations/**/*"
        description: migration files exist

      - id: required_tables_in_migrations
        type: file_list_contains_all
        keywords:
          - users
          - products
          - orders
          - order_products
          - product_orders
        description: Migration files reference required tables
    pass_feedback: |
      > **Passing ✅** — The database design includes evidence of the required relational tables.

      ## General Feedback

      Your migrations show evidence of a relational schema that supports the project requirements. The required table groups are represented, and the database structure can be reviewed against the documented API data shapes.

      ## Requirement Status

      - **Required tables:** ✔ Migration evidence exists for the project tables.
      - **Relationships:** ✔ The schema includes evidence for order/product relationships.
      - **Reviewability:** ✔ The migrations give reviewers a concrete source for table and column verification.

      ## Recommendations

      - Confirm the actual database after migration with `psql` commands such as `\dt` and `\d table_name`.
      - Avoid reserved or confusing names like `count`; use `quantity` for order/product quantity.

      ## Reference Resources

      - PostgreSQL table basics: https://www.postgresql.org/docs/current/ddl-basics.html
      - PostgreSQL constraints: https://www.postgresql.org/docs/current/ddl-constraints.html
      - PostgreSQL lexical structure and keywords: https://www.postgresql.org/docs/current/sql-syntax-lexical.html
    fail_feedback: |
      > **Not Passing ❌** — The relational database design is missing or incomplete.

      ## General Feedback

      The project needs migrations or schema files that create the required tables, columns, and relationships. The schema should support all required API endpoints and include the join or relationship structure needed for orders and products.

      ## Requirement Status

      - **Required tables:** ❌ Add migrations for users, products, orders, and order/product relationship data.
      - **Relationships:** ❌ Add foreign keys or relationship columns that connect orders to users and products.
      - **Reviewability:** ❌ Reviewers need migration files or clear schema files to verify the database structure.

      ## Recommendations

      - Add one or more migrations that create the required tables.
      - Include primary keys, foreign keys, and meaningful column types.
      - Use `quantity` instead of `count` for order item quantities.

      ## Reference Resources

      - PostgreSQL table basics: https://www.postgresql.org/docs/current/ddl-basics.html
      - PostgreSQL constraints: https://www.postgresql.org/docs/current/ddl-constraints.html
      - PostgreSQL lexical structure and keywords: https://www.postgresql.org/docs/current/sql-syntax-lexical.html

  - id: sql_crud_queries
    title: SQL CRUD Queries
    requirement: Write well-formed SQL queries for select, update, delete, and where/single-item actions.
    pass_rule: all
    checks:
      - id: model_files_exist
        type: glob_exists
        pattern: "**/*model*.*"
        description: Model files exist for SQL query review

      - id: sql_select
        type: file_list_contains_any
        keywords:
          - user
          - product
          - order
        description: Files exist for required data models

      - id: pg_dependency
        type: package_json_has_dependency
        dependencies:
          - pg
        mode: any
        description: package.json includes PostgreSQL client dependency
    pass_feedback: |
      > **Passing ✅** — The project includes evidence of SQL-backed CRUD model actions.

      ## General Feedback

      Your project includes model/data-access files and PostgreSQL support, giving reviewers a place to verify the required SQL actions. The model layer should retrieve, create, update, delete, and filter records as required by the project specifications.

      ## Requirement Status

      - **Select queries:** ✔ Model/data-access files are present for retrieving data.
      - **Create/update/delete queries:** ✔ The project structure supports CRUD query review.
      - **Where/single-item queries:** ✔ Required models can be checked for single-record lookup logic.

      ## Recommendations

      - Use parameterized queries with `$1`, `$2`, etc. rather than string interpolation.
      - Release database connections after queries, preferably in `finally` blocks when using explicit clients.
      - Make sure each query returns the expected row or rows for its model method.

      ## Reference Resources

      - node-postgres queries: https://node-postgres.com/features/queries
      - PostgreSQL `SELECT`: https://www.postgresql.org/docs/current/sql-select.html
      - PostgreSQL `UPDATE`: https://www.postgresql.org/docs/current/sql-update.html
      - PostgreSQL `DELETE`: https://www.postgresql.org/docs/current/sql-delete.html
    fail_feedback: |
      > **Not Passing ❌** — SQL CRUD query evidence is missing or incomplete.

      ## General Feedback

      The project needs model/data-access code that performs the required SQL actions: selecting records, creating records, updating records, deleting records, and finding single records with `WHERE` clauses. If these model methods are missing or not connected to PostgreSQL, the API cannot satisfy the backend requirements.

      ## Requirement Status

      - **Select queries:** ❌ Add model methods that retrieve all records and individual records.
      - **Create/update/delete queries:** ❌ Add the required SQL actions for each model.
      - **Where/single-item queries:** ❌ Add parameterized `WHERE` queries for routes like `/:id`.

      ## Recommendations

      - Create model classes or stores for users, products, and orders.
      - Use parameterized SQL to protect against SQL injection.
      - Add tests for every database action after implementing the queries.

      ## Reference Resources

      - node-postgres queries: https://node-postgres.com/features/queries
      - PostgreSQL `SELECT`: https://www.postgresql.org/docs/current/sql-select.html
      - PostgreSQL `UPDATE`: https://www.postgresql.org/docs/current/sql-update.html
      - PostgreSQL `DELETE`: https://www.postgresql.org/docs/current/sql-delete.html

  - id: migrations
    title: Database Migrations
    requirement: Use migrations to create/update the database, with matching up and down migrations.
    pass_rule: all
    checks:
      - id: db_migrate_dependency
        type: package_json_has_dependency
        dependencies:
          - db-migrate
          - db-migrate-pg
        mode: any
        description: package.json includes db-migrate tooling

      - id: migrations_folder
        type: folder_exists
        path: migrations
        description: migrations folder exists

      - id: migration_files
        type: glob_exists
        pattern: "migrations/**/*"
        description: migration files exist
    pass_feedback: |
      > **Passing ✅** — Database migrations are present and configured for schema creation.

      ## General Feedback

      Your project includes migration tooling and migration files, which allows reviewers to recreate the database schema consistently. This is the expected workflow for the Storefront Backend project.

      ## Requirement Status

      - **Migration tooling:** ✔ `db-migrate` and/or `db-migrate-pg` is included.
      - **Migration files:** ✔ Migration files are present in the project.
      - **Database reproducibility:** ✔ Reviewers have a migration path to create the database schema.

      ## Recommendations

      - Verify that every `up` migration has a matching `down` migration.
      - Run `db-migrate up` from a clean database to confirm the schema can be recreated.
      - Keep old experimental migrations cleaned up if they are no longer needed.

      ## Reference Resources

      - db-migrate documentation: https://db-migrate.readthedocs.io/
      - db-migrate PostgreSQL driver: https://www.npmjs.com/package/db-migrate-pg
      - PostgreSQL `CREATE TABLE`: https://www.postgresql.org/docs/current/sql-createtable.html
    fail_feedback: |
      > **Not Passing ❌** — Database migrations are missing or not clearly configured.

      ## General Feedback

      A reviewer should be able to run the migrations and create a working database schema. The project needs migration tooling, migration files, and matching up/down behavior for each table creation or schema update.

      ## Requirement Status

      - **Migration tooling:** ❌ Add `db-migrate` and `db-migrate-pg` or make the migration workflow clear.
      - **Migration files:** ❌ Add migration files for the required tables and columns.
      - **Database reproducibility:** ❌ Reviewers need to be able to run `db-migrate up` successfully from a clean database.

      ## Recommendations

      - Add migrations for users, products, orders, and order/product relationship tables.
      - Include both `up` and `down` SQL for every migration.
      - Document migration commands in the README.

      ## Reference Resources

      - db-migrate documentation: https://db-migrate.readthedocs.io/
      - db-migrate PostgreSQL driver: https://www.npmjs.com/package/db-migrate-pg
      - PostgreSQL `CREATE TABLE`: https://www.postgresql.org/docs/current/sql-createtable.html

  - id: password_hashing
    title: Password Security
    requirement: Secure important information by adding salt to user passwords with bcrypt.
    pass_rule: all
    checks:
      - id: bcrypt_dependency
        type: package_json_has_dependency
        dependencies:
          - bcrypt
          - bcryptjs
        mode: any
        description: package.json includes bcrypt or bcryptjs

      - id: user_files
        type: file_list_contains_any
        keywords:
          - user
          - users
        description: User-related files exist for password handling review
    pass_feedback: |
      > **Passing ✅** — User passwords are handled with bcrypt-based hashing.

      ## General Feedback

      Your project includes evidence of bcrypt-based password hashing, which is the required approach for storing user passwords securely. Reviewers should still confirm that plain text passwords are never stored in the database.

      ## Requirement Status

      - **bcrypt dependency:** ✔ The project includes `bcrypt` or `bcryptjs`.
      - **User password handling:** ✔ User-related files are present for reviewing hash usage.
      - **Plain text protection:** ✔ The expected implementation is to store hashes, not raw passwords.

      ## Recommendations

      - Hash passwords before insert/update operations.
      - Use `bcrypt.compare` or the equivalent when verifying login credentials.
      - Keep the pepper/salt secret or bcrypt configuration in environment variables when applicable.

      ## Reference Resources

      - bcrypt npm package: https://www.npmjs.com/package/bcrypt
      - bcryptjs npm package: https://www.npmjs.com/package/bcryptjs
      - OWASP password storage cheat sheet: https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
    fail_feedback: |
      > **Not Passing ❌** — Password hashing with bcrypt is missing or not clear.

      ## General Feedback

      User passwords must be hashed before they are stored. If a reviewer can see plain text passwords in the database, the project should not pass this requirement.

      ## Requirement Status

      - **bcrypt dependency:** ❌ Add `bcrypt` or `bcryptjs`.
      - **User password handling:** ❌ Implement hashing in the user creation/update path.
      - **Plain text protection:** ❌ Ensure the database stores password hashes only.

      ## Recommendations

      - Hash passwords before inserting users into the database.
      - Use `bcrypt.compare` when validating credentials.
      - Add a model test confirming the stored password is not equal to the original plain text password.

      ## Reference Resources

      - bcrypt npm package: https://www.npmjs.com/package/bcrypt
      - bcryptjs npm package: https://www.npmjs.com/package/bcryptjs
      - OWASP password storage cheat sheet: https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html

  - id: crud_endpoints
    title: CRUD Endpoints and Handlers
    requirement: Create CRUD endpoints for models and split routes into grouped handler files.
    pass_rule: all
    checks:
      - id: express_dependency
        type: package_json_has_dependency
        dependencies:
          - express
        mode: any
        description: package.json includes Express

      - id: handler_files
        type: file_list_contains_any
        keywords:
          - handler
          - handlers
          - route
          - routes
        description: Route or handler files exist

      - id: required_resource_files
        type: file_list_contains_all
        keywords:
          - users
          - products
          - orders
        description: Files reference required API resources
    pass_feedback: |
      > **Passing ✅** — Express CRUD endpoints and route organization are present.

      ## General Feedback

      Your project includes Express and route/handler structure for the required resources. This gives reviewers a clear place to verify each RESTful endpoint against `REQUIREMENTS.md`.

      ## Requirement Status

      - **Express API setup:** ✔ The project includes Express.
      - **Grouped route/handler files:** ✔ Route or handler files are present.
      - **Required resources:** ✔ The project includes evidence for users, products, and orders endpoints.

      ## Recommendations

      - Keep handlers grouped by model/resource, such as `products.ts`, `users.ts`, and `orders.ts`.
      - Confirm every required route in `REQUIREMENTS.md` is implemented with the correct HTTP verb.
      - Mark protected routes clearly and apply JWT middleware where required.

      ## Reference Resources

      - Express routing guide: https://expressjs.com/en/guide/routing.html
      - Express basic routing: https://expressjs.com/en/starter/basic-routing.html
      - MDN HTTP response status codes: https://developer.mozilla.org/en-US/docs/Web/HTTP/Status
    fail_feedback: |
      > **Not Passing ❌** — Required CRUD endpoints or grouped handlers are missing.

      ## General Feedback

      The API must include all required endpoints from `REQUIREMENTS.md`. Routes should be RESTful, use the correct HTTP verbs, and ideally be grouped into handler files for products, users, and orders.

      ## Requirement Status

      - **Express API setup:** ❌ Add or verify the Express server setup.
      - **Grouped route/handler files:** ❌ Add handler/route files or make endpoint organization clear.
      - **Required resources:** ❌ Implement all required user, product, and order endpoints.

      ## Recommendations

      - Compare `REQUIREMENTS.md` route-by-route against the Express handlers.
      - Add missing routes with correct verbs and RESTful paths.
      - Use `express.Router()` to organize route groups.

      ## Reference Resources

      - Express routing guide: https://expressjs.com/en/guide/routing.html
      - Express basic routing: https://expressjs.com/en/starter/basic-routing.html
      - MDN HTTP response status codes: https://developer.mozilla.org/en-US/docs/Web/HTTP/Status

  - id: models
    title: Model Files
    requirement: Craft model files that translate database tables into useful Node application entities.
    pass_rule: all
    checks:
      - id: model_files_exist
        type: file_list_contains_any
        keywords:
          - models
          - model
          - store
        description: Model folder/files exist

      - id: required_model_files
        type: file_list_contains_all
        keywords:
          - users
          - products
          - orders
        description: Model files reference required tables

      - id: typescript_dependency
        type: package_json_has_dependency
        dependencies:
          - typescript
        mode: any
        description: package.json includes TypeScript
    pass_feedback: |
      > **Passing ✅** — Model files are present for the required database entities.

      ## General Feedback

      Your project includes evidence of a model layer that maps database tables into Node/TypeScript entities. This is the expected place for reviewers to verify database methods and related types.

      ## Requirement Status

      - **Model files:** ✔ Model/store files are present.
      - **Required entities:** ✔ Users, products, and orders are represented.
      - **TypeScript support:** ✔ TypeScript is included for typed model entities.

      ## Recommendations

      - Define a `type` or `interface` for each model entity.
      - Keep one model/store file per table or major resource.
      - Make sure models reflect the actual database columns and return expected values.

      ## Reference Resources

      - TypeScript object types: https://www.typescriptlang.org/docs/handbook/2/everyday-types.html
