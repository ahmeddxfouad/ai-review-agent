  - id: environment_variables
    title: Environment Variables
    requirement: Secure database access info with dotenv and list .env in .gitignore.
    pass_rule: all
    checks:
      - id: dotenv_dependency
        type: package_json_has_dependency
        dependencies:
          - dotenv
        mode: any
        description: package.json includes dotenv

      - id: gitignore_exists
        type: file_exists
        path: .gitignore
        description: .gitignore exists

      - id: env_ignored
        type: text_contains_any
        path: .gitignore
        keywords:
          - .env
        description: .env is listed in .gitignore

      - id: env_documented
        type: text_contains_any
        path: README.md
        keywords:
          - ENV
          - .env
          - POSTGRES
          - TOKEN_SECRET
          - BCRYPT
        description: README documents required environment variables for reviewer visibility
    pass_feedback: |
      > **Passing ✅** — Environment variables are correctly managed with dotenv and protected via .gitignore.

      ## General Feedback

      Your environment configuration follows good security and workflow practices. You are using `dotenv` appropriately, and your setup makes it clear how the project should be configured without exposing sensitive data in version control.

      ## Requirement Status

      - **Use of dotenv:** ✔ Environment variables are loaded using `dotenv`.
      - **.env in .gitignore:** ✔ The `.env` file is listed in `.gitignore`, so it should not be committed to the repository.
      - **Reviewer visibility:** ✔ Environment variable values or examples are documented in `README.md`, allowing the reviewer to see the required configuration without needing the actual `.env` file.

      ## Recommendations

      - Consider grouping environment variables in the README under a dedicated **Environment Variables** or **.env Example** section for quick reference.
      - If not already present, add a sample `.env.example` file without real secrets to show expected keys and formats.

      ## Reference Resources

      - dotenv package documentation: https://www.npmjs.com/package/dotenv
      - Twelve-Factor App config: https://12factor.net/config
      - GitHub documentation for ignoring files: https://docs.github.com/en/get-started/git-basics/ignoring-files
    fail_feedback: |
